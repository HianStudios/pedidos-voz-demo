<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f3ec"><title>Brasa · Caja en vivo</title><link rel="icon" href="/public/favicon.svg"><link rel="stylesheet" href="/public/styles.css"></head>
<body class="cashier-page">
<header class="site-header"><a class="brand" href="/"><span class="brand-icon">b<span>•</span></span>brasa<span class="brand-dot">®</span></a><div class="header-right"><span class="demo-badge" id="modeBadge">Cargando…</span><a class="text-button" href="/admin.html">Panel ↗</a><button class="text-button" id="logout" hidden>Salir</button></div></header>
<main class="cashier-main"><section class="cashier-heading"><div><div class="eyebrow">EL SABOR SIGUE SU CURSO</div><h1>Tu caja.<br><em>Todo en orden.</em></h1><p class="muted" id="cashierInfo">Conectando con el restaurante…</p></div><div class="connection" id="connection" role="status" data-state="connecting"><span class="live-dot"></span><span id="connectionText">Conectando…</span><small id="lastUpdate"></small></div></section>
<form id="staffForm" class="staff-login" hidden><h2>Acceso del equipo</h2><p class="muted">Ingresa la clave del personal para ver los pedidos.</p><label for="staffToken">Clave de caja</label><div class="staff-entry"><input id="staffToken" type="password" autocomplete="current-password" required><button class="primary-button">Entrar</button></div><p id="loginError" role="alert"></p></form>
<section id="alerts" class="alerts" role="status" aria-live="polite" hidden></section>
<section id="workspace" hidden><div class="cashier-stats"><article><span>Por atender</span><strong id="newCount">0</strong></article><article><span>En preparación</span><strong id="preparingCount">0</strong></article><article><span>Listos para retirar</span><strong id="readyCount">0</strong></article></div><div class="cashier-toolbar"><nav class="cashier-filters" aria-label="Filtrar pedidos"><button data-filter="active" aria-pressed="true">En curso</button><button data-filter="all" aria-pressed="false">Todos</button><button data-filter="done" aria-pressed="false">Finalizados</button></nav><button class="text-button" id="reconnect">Reconectar ↻</button></div><p id="queueNotice" role="status" class="muted"></p><div id="queue" class="cashier-grid"></div></section>
</main><div class="toast" id="toast" role="status"></div><script type="module" src="/public/js/cashier.js"></script></body></html>
