<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sabor Casero — Pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0D0D0D;--surface:rgba(255,255,255,0.04);--surface2:rgba(255,255,255,0.07);
  --glass:rgba(255,255,255,0.06);--glass-border:rgba(255,255,255,0.09);
  --text:#F0EDE8;--text-dim:rgba(240,237,232,0.5);--text-mid:rgba(240,237,232,0.72);
  --gold:#D4A853;--gold-dim:rgba(212,168,83,0.2);--gold-glow:rgba(212,168,83,0.35);
  --green:#4A7C59;--green-dim:rgba(74,124,89,0.18);--red:#C14040;
  --font:'DM Sans',sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;}
body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100%;overflow:hidden;}
.app{max-width:480px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;}

/* Header */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));
  background:rgba(13,13,13,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--glass-border);z-index:10;flex-shrink:0;
}
.logo{font-weight:700;font-size:1.1rem;letter-spacing:-0.02em;}
.logo span{color:var(--gold);}
.tabs{display:flex;gap:2px;background:var(--surface2);border-radius:8px;padding:3px;}
.tabs button{
  border:none;background:transparent;font-family:var(--font);font-weight:500;font-size:0.75rem;
  padding:6px 12px;border-radius:6px;color:var(--text-dim);cursor:pointer;transition:all .2s ease-out;
}
.tabs button.active{background:var(--gold);color:#0D0D0D;font-weight:700;}

/* Views */
main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.view{display:none;flex:1;flex-direction:column;overflow:hidden;}
.view.active{display:flex;}

/* AI Banner */
.ai-banner{
  display:flex;align-items:center;gap:10px;padding:12px 16px;flex-shrink:0;
  background:linear-gradient(135deg,rgba(212,168,83,0.08),transparent);
  border-bottom:1px solid var(--glass-border);min-height:48px;
}
.ai-avatar{
  width:32px;height:32px;border-radius:8px;flex-shrink:0;
  background:linear-gradient(135deg,var(--gold-dim),var(--surface2));
  display:flex;align-items:center;justify-content:center;font-size:0.9rem;
}
.ai-text{font-size:0.88rem;line-height:1.4;color:var(--text);flex:1;}
.ai-text .typing{display:inline-flex;gap:3px;vertical-align:middle;}
.ai-text .typing span{
  width:5px;height:5px;border-radius:50%;background:var(--gold);
  animation:blink 1.4s infinite both;display:inline-block;
}
.ai-text .typing span:nth-child(2){animation-delay:.2s;}
.ai-text .typing span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.3;}40%{opacity:1;}}

/* Category tabs */
.cat-tabs{display:flex;gap:0;padding:8px 16px;flex-shrink:0;}
.cat-tab{
  flex:1;border:none;background:var(--surface2);font-family:var(--font);font-weight:600;
  font-size:0.8rem;padding:9px 0;color:var(--text-dim);cursor:pointer;
  transition:all .2s ease-out;
}
.cat-tab:first-child{border-radius:8px 0 0 8px;}
.cat-tab:last-child{border-radius:0 8px 8px 0;}
.cat-tab.active{background:var(--gold-dim);color:var(--gold);}

/* Menu grid */
.menu-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 12px 100px;-webkit-overflow-scrolling:touch;}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.menu-card{
  background:var(--glass);border:1px solid var(--glass-border);border-radius:12px;
  overflow:hidden;cursor:pointer;transition:transform .15s ease-out,border-color .2s ease-out,box-shadow .3s ease-out;
  position:relative;
}
.menu-card:active{transform:scale(0.96);}
.menu-card.highlighted{border-color:var(--gold);box-shadow:0 0 16px var(--gold-glow);animation:glow 2s ease-in-out infinite;}
@keyframes glow{0%,100%{box-shadow:0 0 12px var(--gold-glow);}50%{box-shadow:0 0 24px var(--gold-glow);}}
.menu-card.just-added{animation:addPop .4s ease-out;}
@keyframes addPop{0%{transform:scale(1);}30%{transform:scale(0.94);}60%{transform:scale(1.02);}100%{transform:scale(1);}}
.menu-card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--surface2);}
.menu-card .placeholder-img{
  width:100%;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;
  background:var(--surface2);font-size:2rem;
}
.menu-card .card-body{padding:8px 10px 10px;}
.menu-card h3{font-weight:700;font-size:0.82rem;line-height:1.2;margin-bottom:2px;letter-spacing:-0.01em;}
.menu-card .desc{font-size:0.7rem;color:var(--text-dim);line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.menu-card .card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:6px;}
.menu-card .price{color:var(--gold);font-weight:700;font-size:0.85rem;}
.menu-card .add-badge{
  width:26px;height:26px;border-radius:50%;background:var(--gold-dim);
  display:flex;align-items:center;justify-content:center;
  color:var(--gold);font-size:0.85rem;font-weight:700;transition:all .15s ease-out;
}
.menu-card .add-badge.in-cart{background:var(--gold);color:#0D0D0D;}

/* Input bar (sticky bottom) */
.input-bar{
  position:absolute;bottom:0;left:0;right:0;z-index:5;
  display:flex;align-items:center;gap:8px;padding:10px 12px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  background:rgba(13,13,13,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--glass-border);
}
.input-bar input{
  flex:1;padding:11px 14px;border-radius:22px;
  background:var(--surface2);border:1px solid var(--glass-border);
  color:var(--text);font-family:var(--font);font-size:0.88rem;outline:none;
  transition:border-color .2s ease-out;
}
.input-bar input::placeholder{color:var(--text-dim);}
.input-bar input:focus{border-color:rgba(212,168,83,0.3);}
.input-bar .send-btn{
  display:none;width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;
  background:var(--gold);color:#0D0D0D;font-size:1rem;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.mic-btn{
  width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;flex-shrink:0;
  background:linear-gradient(145deg,rgba(212,168,83,0.2),rgba(212,168,83,0.08));
  border:1.5px solid rgba(212,168,83,0.3);color:var(--gold);
  display:flex;align-items:center;justify-content:center;
  transition:all .2s ease-out;position:relative;
}
.mic-btn svg{width:20px;height:20px;fill:currentColor;}
.mic-btn.recording{background:var(--red);border-color:var(--red);color:#fff;}
.mic-btn.recording svg{width:14px;height:14px;}
.voice-note{
  position:absolute;bottom:calc(64px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);
  font-size:0.72rem;color:var(--text-dim);text-align:center;white-space:nowrap;
}

/* Recording overlay in input */
.rec-indicator{
  display:none;flex:1;align-items:center;gap:8px;padding:0 8px;
}
.rec-indicator.active{display:flex;}
.rec-indicator .wave{display:flex;gap:3px;align-items:center;height:20px;}
.rec-indicator .wave span{
  width:3px;border-radius:2px;background:var(--red);animation:wave 1s ease-in-out infinite;
}
.rec-indicator .wave span:nth-child(1){height:6px;animation-delay:0s;}
.rec-indicator .wave span:nth-child(2){height:14px;animation-delay:.1s;}
.rec-indicator .wave span:nth-child(3){height:20px;animation-delay:.2s;}
.rec-indicator .wave span:nth-child(4){height:14px;animation-delay:.3s;}
.rec-indicator .wave span:nth-child(5){height:6px;animation-delay:.4s;}
@keyframes wave{0%,100%{transform:scaleY(.4);}50%{transform:scaleY(1);}}
.rec-indicator .rec-text{font-size:0.82rem;color:var(--red);font-weight:500;}
.rec-indicator .rec-time{font-size:0.78rem;color:var(--text-dim);margin-left:auto;font-variant-numeric:tabular-nums;}

/* Cart FAB */
.cart-fab{
  position:absolute;bottom:calc(68px + env(safe-area-inset-bottom,0px));right:12px;z-index:6;
  display:none;align-items:center;gap:8px;padding:10px 16px;
  background:var(--gold);color:#0D0D0D;border:none;border-radius:22px;
  font-family:var(--font);font-weight:700;font-size:0.85rem;cursor:pointer;
  box-shadow:0 6px 24px rgba(0,0,0,0.5);transition:transform .15s ease-out;
  animation:fabIn .3s ease-out;
}
@keyframes fabIn{from{transform:translateY(20px) scale(0.9);opacity:0;}to{transform:translateY(0) scale(1);opacity:1;}}
.cart-fab:active{transform:scale(0.95);}
.cart-fab .count{
  width:22px;height:22px;border-radius:50%;background:#0D0D0D;color:var(--gold);
  display:flex;align-items:center;justify-content:center;font-size:0.72rem;
}

/* Cart drawer */
.cart-overlay{
  position:absolute;inset:0;z-index:20;display:none;
}
.cart-overlay.open{display:flex;flex-direction:column;justify-content:flex-end;}
.cart-backdrop{
  position:absolute;inset:0;background:rgba(0,0,0,0.6);
  animation:fadeIn .2s ease-out;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.cart-drawer{
  position:relative;z-index:1;background:rgba(20,20,20,0.98);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:16px 16px 0 0;padding:16px;
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
  max-height:60vh;overflow-y:auto;
  animation:slideUp .3s ease-out;
}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.cart-drawer h4{font-weight:700;font-size:0.92rem;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}
.cart-drawer .close-cart{border:none;background:var(--surface2);color:var(--text-dim);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:0.9rem;display:flex;align-items:center;justify-content:center;}
.cart-line{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--glass-border);}
.cart-line:last-of-type{border-bottom:none;}
.cart-line .item-info{flex:1;}
.cart-line .item-name{font-size:0.88rem;font-weight:500;}
.cart-line .item-price{font-size:0.78rem;color:var(--gold);}
.qty-controls{display:flex;align-items:center;gap:6px;}
.qty-btn{
  width:28px;height:28px;border-radius:8px;border:1px solid var(--glass-border);
  background:var(--surface2);color:var(--text);font-size:0.85rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-family:var(--font);
}
.qty-btn:active{transform:scale(0.9);}
.qty-num{font-size:0.88rem;font-weight:700;min-width:20px;text-align:center;}
.cart-total{display:flex;justify-content:space-between;font-weight:700;font-size:1rem;margin-top:12px;padding-top:12px;border-top:1px solid var(--glass-border);}
.cart-total .amount{color:var(--gold);}
.confirm-btn{
  width:100%;margin-top:12px;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--gold),#B8913D);color:#0D0D0D;
  font-weight:700;padding:14px;border-radius:12px;font-size:0.92rem;font-family:var(--font);
  transition:transform .15s ease-out;
}
.confirm-btn:active{transform:scale(0.97);}

/* Toast */
.toast{
  position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;
  transform:translate(-50%,-120%);z-index:30;
  background:rgba(74,124,89,0.95);backdrop-filter:blur(12px);
  color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;font-size:0.85rem;
  box-shadow:0 8px 32px rgba(0,0,0,0.4);transition:transform .3s ease-out;max-width:90%;text-align:center;
}
.toast.show{transform:translate(-50%,0);}

/* Cajero */
.cajero-scroll{flex:1;overflow-y:auto;padding:12px;}
.cajero-header{display:flex;align-items:baseline;justify-content:space-between;padding:4px 4px 12px;}
.cajero-header h2{font-weight:700;font-size:1.05rem;}
.badge{font-size:0.72rem;font-weight:700;background:var(--gold-dim);color:var(--gold);padding:3px 10px;border-radius:20px;}
.order-card{
  background:var(--glass);border:1px solid var(--glass-border);
  border-radius:12px;padding:14px;margin-bottom:10px;animation:cardIn .3s ease-out;
}
@keyframes cardIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.order-card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.order-card .num{font-weight:700;font-size:0.95rem;}
.order-card .time{font-size:0.72rem;color:var(--text-dim);}
.order-card .status{font-size:0.68rem;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--gold-dim);color:var(--gold);}
.order-card .item{display:flex;justify-content:space-between;font-size:0.85rem;padding:2px 0;color:var(--text-mid);}
.order-card .total{display:flex;justify-content:space-between;font-weight:700;margin-top:6px;padding-top:6px;border-top:1px solid var(--glass-border);}
.order-card .total .amount{color:var(--gold);}
.ready-btn{
  width:100%;margin-top:10px;border:none;background:var(--green-dim);color:var(--green);
  font-weight:700;padding:10px;border-radius:8px;cursor:pointer;font-size:0.82rem;font-family:var(--font);
}
.ready-btn:active{transform:scale(0.97);}
.empty-queue{text-align:center;color:var(--text-dim);font-size:0.88rem;padding:48px 20px;}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">Sabor <span>Casero</span></div>
    <div class="tabs">
      <button id="tabCliente" class="active">Cliente</button>
      <button id="tabCajero">Cajero</button>
    </div>
  </header>

  <main>
    <!-- CLIENTE -->
    <section id="viewCliente" class="view active">
      <div class="ai-banner" id="aiBanner">
        <div class="ai-avatar">🍲</div>
        <div class="ai-text" id="aiText">¡Buenas! ¿Qué se le antoja hoy?</div>
      </div>

      <div class="cat-tabs">
        <button class="cat-tab active" data-cat="platos">🍽 Platos</button>
        <button class="cat-tab" data-cat="bebidas">🥤 Bebidas</button>
      </div>

      <div class="menu-scroll" id="menuScroll">
        <div class="menu-grid" id="menuGrid"></div>
      </div>

      <button class="cart-fab" id="cartFab" style="display:none;">
        🛒 <span id="cartSummary">0 items — $0.00</span>
        <span class="count" id="cartCount">0</span>
      </button>

      <div class="input-bar" id="inputBar">
        <input id="textInput" type="text" placeholder="Diga o escriba su pedido...">
        <div class="rec-indicator" id="recIndicator">
          <div class="wave"><span></span><span></span><span></span><span></span><span></span></div>
          <span class="rec-text">Escuchando</span>
          <span class="rec-time" id="recTime">0s</span>
        </div>
        <button class="mic-btn" id="micBtn">
          <svg id="micIcon" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
          <svg id="stopIcon" viewBox="0 0 24 24" style="display:none;"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
      </div>
      <div class="voice-note" id="voiceNote"></div>

      <!-- Cart drawer -->
      <div class="cart-overlay" id="cartOverlay">
        <div class="cart-backdrop" id="cartBackdrop"></div>
        <div class="cart-drawer" id="cartDrawer"></div>
      </div>
    </section>

    <!-- CAJERO -->
    <section id="viewCajero" class="view">
      <div class="cajero-scroll">
        <div class="cajero-header">
          <h2>Pedidos</h2>
          <span class="badge" id="queueCount">0</span>
        </div>
        <div id="queueList"></div>
      </div>
    </section>
  </main>
</div>
<div class="toast" id="toast"></div>

// ---- Sonidos (Web Audio API) ----
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(freq, dur, type='sine'){
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(freq * 0.6, audioCtx.currentTime + dur);
  gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + dur);
}
function popSound(){ playSound(660, 0.1); }
function dingSound(){ playSound(880, 0.2); setTimeout(() => playSound(1100, 0.15), 100); }

// ---- Menu rendering ----
function renderMenu(){
  const items = MENU.filter(d => d.cat === currentCat);
  menuGrid.innerHTML = '';
  items.forEach(dish => {
    const inCart = currentOrder.find(l => l.id === dish.id);
    const card = document.createElement('div');
    card.className = 'menu-card';
    card.dataset.id = dish.id;
    card.innerHTML = `
      ${dish.img ? `<img src="${dish.img}" alt="${dish.name}" loading="lazy">` : `<div class="placeholder-img">${dish.emoji}</div>`}
      <div class="card-body">
        <h3>${dish.name}</h3>
        <div class="desc">${dish.desc}</div>
        <div class="card-footer">
          <span class="price">$${dish.price.toFixed(2)}</span>
          <span class="add-badge ${inCart ? 'in-cart' : ''}">${inCart ? inCart.qty : '+'}</span>
        </div>
      </div>`;
    card.addEventListener('click', () => addToCart(dish));
    menuGrid.appendChild(card);
  });
}

function addToCart(dish){
  audioCtx.resume();
  popSound();
  const existing = currentOrder.find(l => l.id === dish.id);
  if(existing) existing.qty += 1;
  else currentOrder.push({ ...dish, qty:1 });
  updateCartUI();
  aiSay(`${dish.name} agregado. ¿Algo más?`);

  // Card pop animation
  const card = menuGrid.querySelector(`[data-id="${dish.id}"]`);
  if(card){ card.classList.remove('just-added'); void card.offsetWidth; card.classList.add('just-added'); }
}

function updateCartUI(){
  const count = currentOrder.reduce((s,l) => s + l.qty, 0);
  const total = currentOrder.reduce((s,l) => s + l.price*l.qty, 0);
  if(count > 0){
    cartFab.style.display = 'flex';
    cartSummary.textContent = `${count} item${count>1?'s':''} — $${total.toFixed(2)}`;
    cartCount.textContent = count;
  } else {
    cartFab.style.display = 'none';
  }
  renderMenu(); // refresh badges
}

// ---- Cart drawer ----
cartFab.addEventListener('click', openCart);
function openCart(){
  cartOverlay.classList.add('open');
  renderCartDrawer();
}
cartBackdrop.addEventListener('click', closeCart);
function closeCart(){ cartOverlay.classList.remove('open'); }

function renderCartDrawer(){
  const total = currentOrder.reduce((s,l) => s + l.price*l.qty, 0);
  cartDrawer.innerHTML = `
    <h4>Su pedido <button class="close-cart" id="closeCart">✕</button></h4>
    ${currentOrder.map((l,i) => `
      <div class="cart-line">
        <div class="item-info">
          <div class="item-name">${l.name}</div>
          <div class="item-price">$${l.price.toFixed(2)} c/u</div>
        </div>
        <div class="qty-controls">
          <button class="qty-btn" data-action="dec" data-idx="${i}">−</button>
          <span class="qty-num">${l.qty}</span>
          <button class="qty-btn" data-action="inc" data-idx="${i}">+</button>
        </div>
      </div>`).join('')}
    <div class="cart-total"><span>Total</span><span class="amount">$${total.toFixed(2)}</span></div>
    <button class="confirm-btn" id="confirmBtn">Confirmar pedido</button>`;

  document.getElementById('closeCart').addEventListener('click', closeCart);
  cartDrawer.querySelectorAll('.qty-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.idx);
      if(btn.dataset.action === 'inc') currentOrder[idx].qty += 1;
      else {
        currentOrder[idx].qty -= 1;
        if(currentOrder[idx].qty <= 0) currentOrder.splice(idx, 1);
      }
      if(currentOrder.length === 0){ closeCart(); }
      else { renderCartDrawer(); }
      updateCartUI();
    });
  });
  document.getElementById('confirmBtn').addEventListener('click', confirmOrder);
}

function confirmOrder(){
  if(currentOrder.length === 0) return;
  audioCtx.resume();
  dingSound();
  const total = currentOrder.reduce((s,l) => s + l.price*l.qty, 0);
  const order = {
    num: orderCounter++,
    items: [...currentOrder],
    total,
    time: new Date().toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'}),
    status: 'nuevo'
  };
  queue.push(order);
  closeCart();
  showToast(`Pedido #${String(order.num).padStart(3,'0')} enviado ✓`);
  aiSay('¡Pedido enviado a caja! ¿Desea algo más?');
  currentOrder = [];
  updateCartUI();
  renderQueue();
}

// ---- AI banner ----
function aiSay(text){
  aiText.innerHTML = text;
  speak(text);
}
function aiThinking(){
  aiText.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
}
function speak(text){
  if(!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'es-ES';
  const voices = speechSynthesis.getVoices();
  const esVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('es'));
  if(esVoice) u.voice = esVoice;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

// ---- Matching ----
function normalize(s){ return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
const UNSURE_WORDS = ['no se','no sé','no tengo idea','sugiereme','sugiérame','recomiend','sorprend','que hay','qué hay','algo rico','algo bueno'];

function localMatch(raw){
  const n = normalize(raw);
  if(UNSURE_WORDS.some(w => n.includes(normalize(w)))){
    return { matched_ids: [], suggest: true, reply: 'Le recomiendo estos — ¡toque el que le llame!' };
  }
  const matches = MENU.filter(d => d.kw.some(k => n.includes(normalize(k))));
  if(matches.length){
    return { matched_ids: matches.slice(0,3).map(d => d.id), suggest: false,
      reply: matches.length === 1 ? `¡${matches[0].name}! Toque para agregarlo.` : '¡Encontré opciones! Las resalté en el menú.' };
  }
  return { matched_ids: [], suggest: true, reply: 'No encontré eso, pero mire el menú — ¡hay de todo!' };
}

async function handleInput(raw){
  if(!raw || !raw.trim()) return;
  aiThinking();

  let result;
  try {
    const res = await fetch('/api/match', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ transcript: raw, menu: MENU.map(d => ({ id: d.id, name: d.name, desc: d.desc })) })
    });
    if(!res.ok) throw new Error('fail');
    result = await res.json();
  } catch(err) { result = localMatch(raw); }

  aiSay(result.reply || '¿Qué le puedo ofrecer?');

  // Highlight matched cards
  document.querySelectorAll('.menu-card').forEach(c => c.classList.remove('highlighted'));
  if(result.matched_ids && result.matched_ids.length > 0){
    // Switch to the category of the first match
    const firstMatch = MENU.find(d => d.id === result.matched_ids[0]);
    if(firstMatch && firstMatch.cat !== currentCat){
      currentCat = firstMatch.cat;
      document.querySelectorAll('.cat-tab').forEach(t => t.classList.toggle('active', t.dataset.cat === currentCat));
      renderMenu();
    }
    setTimeout(() => {
      result.matched_ids.forEach(id => {
        const card = menuGrid.querySelector(`[data-id="${id}"]`);
        if(card){ card.classList.add('highlighted'); card.scrollIntoView({behavior:'smooth',block:'nearest'}); }
      });
    }, 100);
  }
}

// ---- Micrófono (MediaRecorder + Whisper via Groq) ----
let mediaRecorder = null;
let audioChunks = [];

micBtn.addEventListener('click', async () => {
  audioCtx.resume();
  if(recognizing){ mediaRecorder.stop(); return; }

  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch(err) { voiceNote.textContent = 'Micrófono bloqueado — permítalo en el navegador'; return; }

  audioChunks = [];
  mediaRecorder = new MediaRecorder(stream, {
    mimeType: MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/mp4'
  });
  mediaRecorder.ondataavailable = (e) => { if(e.data.size > 0) audioChunks.push(e.data); };
  mediaRecorder.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    recognizing = false;
    clearInterval(recTimer);
    micBtn.classList.remove('recording');
    micIcon.style.display = ''; stopIcon.style.display = 'none';
    recIndicator.classList.remove('active');
    textInput.style.display = '';

    if(audioChunks.length === 0) return;
    const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
    if(blob.size < 1000) return;

    aiThinking();
    try {
      const fd = new FormData();
      fd.append('file', blob, 'audio.' + (mediaRecorder.mimeType.includes('webm') ? 'webm' : 'm4a'));
      const res = await fetch('/api/transcribe', { method: 'POST', body: fd });
      if(!res.ok) throw new Error('fail');
      const data = await res.json();
      if(data.text && data.text.trim()) handleInput(data.text.trim());
      else aiSay('No entendí — intente de nuevo o escriba su pedido');
    } catch(err) { aiSay('Error procesando audio — escriba su pedido'); }
  };

  mediaRecorder.start();
  recognizing = true;
  recSeconds = 0;
  micBtn.classList.add('recording');
  micIcon.style.display = 'none'; stopIcon.style.display = '';
  textInput.style.display = 'none';
  recIndicator.classList.add('active');
  recTime.textContent = '0s';
  recTimer = setInterval(() => { recSeconds++; recTime.textContent = recSeconds + 's'; }, 1000);
  setTimeout(() => { if(recognizing && mediaRecorder.state === 'recording') mediaRecorder.stop(); }, 10000);
});

textInput.addEventListener('keydown', (e) => { if(e.key === 'Enter' && textInput.value.trim()){ handleInput(textInput.value.trim()); textInput.value = ''; } });

// ---- Category tabs ----

// ---- Toast ----
function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2400);
}

// ---- Vista cajero ----
function renderQueue(){
  const queueList = document.getElementById('queueList');
  const queueCount = document.getElementById('queueCount');
  queueCount.textContent = queue.length;
  if(queue.length === 0){ queueList.innerHTML = '<div class="empty-queue">Sin pedidos en cola</div>'; return; }
  queueList.innerHTML = '';
  queue.forEach(order => {
    const card = document.createElement('div');
    card.className = 'order-card';
    card.innerHTML = `
      <div class="top">
        <span class="num">#${String(order.num).padStart(3,'0')}</span>
        <span class="status">${order.status}</span>
        <span class="time">${order.time}</span>
      </div>
      ${order.items.map(i => `<div class="item"><span>${i.name} ×${i.qty}</span><span>$${(i.price*i.qty).toFixed(2)}</span></div>`).join('')}
      <div class="total"><span>Total</span><span class="amount">$${order.total.toFixed(2)}</span></div>
      <button class="ready-btn">Marcar listo</button>`;
    card.querySelector('.ready-btn').addEventListener('click', () => {
      queue = queue.filter(o => o.num !== order.num);
      renderQueue();
    });
    queueList.appendChild(card);
  });
}

// ---- Tabs ----
document.getElementById('tabCliente').addEventListener('click', () => switchTab('Cliente'));
document.getElementById('tabCajero').addEventListener('click', () => switchTab('Cajero'));
function switchTab(name){
  document.getElementById('tabCliente').classList.toggle('active', name === 'Cliente');
  document.getElementById('tabCajero').classList.toggle('active', name === 'Cajero');
  document.getElementById('viewCliente').classList.toggle('active', name === 'Cliente');
  document.getElementById('viewCajero').classList.toggle('active', name === 'Cajero');
  if(name === 'Cajero') renderQueue();
}

// ---- Init ----
renderMenu();
renderQueue();
</script>
