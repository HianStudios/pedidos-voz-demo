<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sabor Casero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#050505;--text:#F0EDE8;--text-dim:rgba(240,237,232,0.45);
  --gold:#D4A853;--gold-dim:rgba(212,168,83,0.15);--gold-glow:rgba(212,168,83,0.25);
  --green:#4A7C59;--green-glow:rgba(74,124,89,0.3);
  --glass:rgba(255,255,255,0.06);--glass-border:rgba(255,255,255,0.1);
  --red:#E05555;--font:'DM Sans',sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow:hidden;}
body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
.app{max-width:480px;margin:0 auto;height:100%;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;}

/* Minimal header */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));
  position:relative;z-index:10;
}
.logo{font-weight:700;font-size:1rem;letter-spacing:-0.02em;opacity:0.6;}
.logo span{color:var(--gold);opacity:1;}
.tab-cajero{
  border:none;background:var(--glass);font-family:var(--font);font-weight:600;font-size:0.72rem;
  padding:6px 12px;border-radius:20px;color:var(--text-dim);cursor:pointer;
  border:1px solid var(--glass-border);
}
.tab-cajero.active{background:var(--gold-dim);color:var(--gold);border-color:var(--gold-glow);}

main{flex:1;position:relative;}
.view{display:none;position:absolute;inset:0;}
.view.active{display:flex;flex-direction:column;}

/* ========== MASCOTA ========== */
.mascot-view{align-items:center;justify-content:center;}

.mascot-wrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:20px;}

/* Ondas detrás de la bolita */
.waves{position:absolute;width:220px;height:220px;top:50%;left:50%;transform:translate(-50%,-50%);}
.wave-ring{
  position:absolute;inset:0;border-radius:50%;
  border:1.5px solid var(--gold-glow);opacity:0;
}
.mascot-wrap.listening .wave-ring{animation:waveOut 2s ease-out infinite;}
.mascot-wrap.listening .wave-ring:nth-child(2){animation-delay:.4s;}
.mascot-wrap.listening .wave-ring:nth-child(3){animation-delay:.8s;}
.mascot-wrap.speaking .wave-ring{animation:waveOut 1.6s ease-out infinite;border-color:var(--green-glow);}
.mascot-wrap.speaking .wave-ring:nth-child(2){animation-delay:.3s;}
.mascot-wrap.speaking .wave-ring:nth-child(3){animation-delay:.6s;}
@keyframes waveOut{
  0%{transform:scale(0.7);opacity:0.6;}
  100%{transform:scale(1.4);opacity:0;}
}

/* La bolita */
.mascot{
  width:120px;height:120px;border-radius:50%;position:relative;cursor:pointer;z-index:2;
  background:radial-gradient(circle at 40% 35%, #3a3a3a, #1a1a1a 70%);
  box-shadow:0 0 40px rgba(0,0,0,0.5), inset 0 -8px 20px rgba(0,0,0,0.4), inset 0 8px 16px rgba(255,255,255,0.04);
  transition:transform .2s ease-out;
}
.mascot:active{transform:scale(0.94);}
.mascot-wrap.listening .mascot{
  box-shadow:0 0 50px var(--gold-glow), inset 0 -8px 20px rgba(0,0,0,0.4);
}
.mascot-wrap.speaking .mascot{
  box-shadow:0 0 50px var(--green-glow), inset 0 -8px 20px rgba(0,0,0,0.4);
}

/* Ojos */
.eyes{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);display:flex;gap:20px;}
.eye{
  width:16px;height:18px;background:#fff;border-radius:50%;position:relative;
  box-shadow:0 0 8px rgba(255,255,255,0.3);
}
.eye::after{
  content:'';position:absolute;width:8px;height:9px;background:#111;border-radius:50%;
  top:50%;left:50%;transform:translate(-50%,-50%);
  transition:transform .1s ease-out;
}
.mascot-wrap.listening .eye{animation:eyeBlink 3s infinite;}
@keyframes eyeBlink{0%,95%,100%{transform:scaleY(1);}96%{transform:scaleY(0.1);}}

/* Boca (ondas sonoras cuando habla) */
.mouth{
  position:absolute;bottom:28%;left:50%;transform:translateX(-50%);
  display:flex;gap:3px;align-items:center;height:14px;
}
.mouth span{
  width:3px;border-radius:2px;background:var(--gold);opacity:0.5;
  height:6px;transition:height .15s ease-out;
}
.mascot-wrap.speaking .mouth span{animation:mouthWave .8s ease-in-out infinite;}
.mascot-wrap.speaking .mouth span:nth-child(1){animation-delay:0s;}
.mascot-wrap.speaking .mouth span:nth-child(2){animation-delay:.1s;height:10px;}
.mascot-wrap.speaking .mouth span:nth-child(3){animation-delay:.2s;height:14px;}
.mascot-wrap.speaking .mouth span:nth-child(4){animation-delay:.1s;height:10px;}
.mascot-wrap.speaking .mouth span:nth-child(5){animation-delay:0s;}
.mascot-wrap.listening .mouth span{animation:mouthWave .6s ease-in-out infinite;background:var(--gold);}
.mascot-wrap.listening .mouth span:nth-child(1){animation-delay:0s;}
.mascot-wrap.listening .mouth span:nth-child(2){animation-delay:.08s;}
.mascot-wrap.listening .mouth span:nth-child(3){animation-delay:.16s;}
.mascot-wrap.listening .mouth span:nth-child(4){animation-delay:.08s;}
.mascot-wrap.listening .mouth span:nth-child(5){animation-delay:0s;}
@keyframes mouthWave{0%,100%{transform:scaleY(0.5);}50%{transform:scaleY(1.3);}}

/* Status text debajo de la mascota */
.status{
  font-size:0.85rem;color:var(--text-dim);text-align:center;max-width:280px;
  line-height:1.4;min-height:42px;display:flex;align-items:center;justify-content:center;
}
.status.ai-talking{color:var(--text);font-weight:500;}

/* Hint */
.hint{
  position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:0;right:0;
  text-align:center;font-size:0.72rem;color:var(--text-dim);opacity:0.5;
}

/* ========== CUADRO FLOTANTE DEL PEDIDO ========== */
.order-float{
  position:absolute;left:16px;right:16px;bottom:calc(80px + env(safe-area-inset-bottom,0px));
  z-index:15;display:none;
}
.order-float.visible{display:block;animation:floatIn .4s ease-out;}
@keyframes floatIn{from{opacity:0;transform:translateY(30px) scale(0.95);}to{opacity:1;transform:translateY(0) scale(1);}}

.order-card{
  background:rgba(22,22,22,0.95);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid var(--gold-glow);border-radius:16px;overflow:hidden;
  box-shadow:0 12px 48px rgba(0,0,0,0.6);
}
.order-card .card-title{
  padding:12px 16px;font-weight:700;font-size:0.85rem;color:var(--gold);
  background:var(--gold-dim);display:flex;align-items:center;justify-content:space-between;
}
.order-card .card-title .total-badge{
  font-size:0.92rem;font-weight:700;
}
.order-item{
  display:flex;align-items:center;gap:10px;padding:10px 16px;
  border-bottom:1px solid rgba(255,255,255,0.05);
}
.order-item:last-of-type{border-bottom:none;}
.order-item img{width:44px;height:44px;object-fit:cover;border-radius:8px;flex-shrink:0;}
.order-item .emoji-thumb{
  width:44px;height:44px;border-radius:8px;background:rgba(255,255,255,0.04);
  display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0;
}
.order-item .info{flex:1;min-width:0;}
.order-item .name{font-weight:600;font-size:0.85rem;}
.order-item .qty{font-size:0.75rem;color:var(--text-dim);margin-top:1px;}
.order-item .price{color:var(--gold);font-weight:700;font-size:0.85rem;flex-shrink:0;}

.order-card .card-footer{
  padding:12px 16px;text-align:center;
  font-size:0.78rem;color:var(--text-dim);
  border-top:1px solid rgba(255,255,255,0.05);
}
.order-card .card-footer strong{color:var(--gold);}

/* ========== CAJERO ========== */
.cajero-view{padding:12px;overflow-y:auto;}
.cajero-header{display:flex;align-items:baseline;justify-content:space-between;padding:4px 4px 12px;}
.cajero-header h2{font-weight:700;font-size:1.05rem;}
.badge{font-size:0.72rem;font-weight:700;background:var(--gold-dim);color:var(--gold);padding:3px 10px;border-radius:20px;}
.caj-card{
  background:var(--glass);border:1px solid var(--glass-border);border-radius:12px;
  padding:14px;margin-bottom:10px;animation:cardIn .3s ease-out;
}
@keyframes cardIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.caj-card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.caj-card .num{font-weight:700;font-size:0.95rem;}
.caj-card .time{font-size:0.72rem;color:var(--text-dim);}
.caj-card .status{font-size:0.68rem;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--gold-dim);color:var(--gold);}
.caj-card .item{display:flex;justify-content:space-between;font-size:0.85rem;padding:2px 0;color:var(--text-dim);}
.caj-card .total{display:flex;justify-content:space-between;font-weight:700;margin-top:6px;padding-top:6px;border-top:1px solid var(--glass-border);}
.caj-card .total .amount{color:var(--gold);}
.ready-btn{width:100%;margin-top:10px;border:none;background:var(--green-glow);color:var(--green);font-weight:700;padding:10px;border-radius:8px;cursor:pointer;font-size:0.82rem;font-family:var(--font);}
.ready-btn:active{transform:scale(0.97);}
.empty-queue{text-align:center;color:var(--text-dim);font-size:0.88rem;padding:48px 20px;}

/* Toast */
.toast{
  position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;
  transform:translate(-50%,-120%);z-index:30;
  background:rgba(74,124,89,0.95);backdrop-filter:blur(12px);
  color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;font-size:0.85rem;
  box-shadow:0 8px 32px rgba(0,0,0,0.4);transition:transform .3s ease-out;max-width:90%;text-align:center;
}
.toast.show{transform:translate(-50%,0);}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">Sabor <span>Casero</span></div>
    <button class="tab-cajero" id="tabCajero">Cajero</button>
  </header>

  <main>
    <!-- MASCOTA -->
    <div class="view active" id="viewCliente">
      <div class="mascot-view">
        <div class="mascot-wrap" id="mascotWrap">
          <div class="waves">
            <div class="wave-ring"></div>
            <div class="wave-ring"></div>
            <div class="wave-ring"></div>
          </div>
          <div class="mascot" id="mascot">
            <div class="eyes">
              <div class="eye"></div>
              <div class="eye"></div>
            </div>
            <div class="mouth">
              <span></span><span></span><span></span><span></span><span></span>
            </div>
          </div>
          <div class="status" id="statusText">Tócame para llamar al mesero</div>
        </div>
        <div class="hint">Toque la bolita para llamar al mesero</div>
      </div>

      <div class="reco-float" id="recoFloat" style="display:none;position:absolute;left:16px;right:16px;bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:14;">
        <div id="recoCard" style="background:rgba(22,22,22,0.95);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--glass-border);border-radius:16px;overflow:hidden;box-shadow:0 12px 48px rgba(0,0,0,0.6);"></div>
      </div>
      <div class="order-float" id="orderFloat">
        <div class="order-card" id="orderCard"></div>
      </div>
    </div>

    <!-- CAJERO -->
    <div class="view" id="viewCajero">
      <div class="cajero-view">
        <div class="cajero-header"><h2>Pedidos</h2><span class="badge" id="queueCount">0</span></div>
        <div id="queueList"></div>
      </div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>

let currentOrder = [];
let queue = [];
let orderCounter = 1;
let recognizing = false;
let sessionActive = false; // sesion activa = mesero despierto
let awaitingConfirmation = false;
let recTimer = null;

const mascotWrap = document.getElementById('mascotWrap');
const mascot = document.getElementById('mascot');
const statusText = document.getElementById('statusText');
const orderFloat = document.getElementById('orderFloat');
const orderCard = document.getElementById('orderCard');
const recoFloat = document.getElementById('recoFloat');
const recoCard = document.getElementById('recoCard');
const toast = document.getElementById('toast');

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(f,d){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.setValueAtTime(f,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(f*.6,audioCtx.currentTime+d);g.gain.setValueAtTime(.06,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d);}
function popSound(){playSound(660,.1);}
function dingSound(){playSound(880,.2);setTimeout(()=>playSound(1100,.15),100);}

// ---- Sesión del mesero ----
function startSession(){
  sessionActive = true;
  mascotSay('¡Buenas! ¿Qué se le antoja?', () => listenLoop());
}

function endSession(){
  sessionActive = false;
  awaitingConfirmation = false;
  mascotWrap.classList.remove('listening','speaking');
  mascotSay('¡Fue un gusto atenderle! Tóqueme cuando necesite algo.', () => {
    statusText.textContent = 'Tócame para llamar al mesero';
  });
}

function listenLoop(){
  if(!sessionActive) return;
  setTimeout(() => { if(sessionActive && !recognizing) startRecording(); }, 800);
}

// ---- Mascota habla ----
function mascotSay(text, onDone){
  mascotWrap.classList.remove('listening');
  mascotWrap.classList.add('speaking');
  statusText.className = 'status ai-talking';
  statusText.textContent = text;
  speak(text, () => {
    mascotWrap.classList.remove('speaking');
    statusText.className = 'status';
    if(onDone) onDone();
  });
}

function speak(text, onEnd){
  if(!('speechSynthesis' in window)){ if(onEnd) onEnd(); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'es-ES';
  const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('es'));
  if(v) u.voice = v;
  u.onend = () => { if(onEnd) onEnd(); };
  u.onerror = () => { if(onEnd) onEnd(); };
  speechSynthesis.speak(u);
}

// ---- Cuadro flotante del pedido ----
function showOrderFloat(){
  if(currentOrder.length === 0){ orderFloat.classList.remove('visible'); return; }
  recoFloat.style.display = 'none'; // ocultar recomendaciones si hay
  const total = currentOrder.reduce((s,l) => s + l.price*l.qty, 0);
  orderCard.innerHTML = `
    <div class="card-title"><span>Su pedido</span><span class="total-badge">$${total.toFixed(2)}</span></div>
    ${currentOrder.map(l => `
      <div class="order-item">
        ${l.img ? `<img src="${l.img}" alt="${l.name}">` : `<div class="emoji-thumb">${l.emoji}</div>`}
        <div class="info"><div class="name">${l.name}</div><div class="qty">×${l.qty}</div></div>
        <span class="price">$${(l.price*l.qty).toFixed(2)}</span>
      </div>`).join('')}
    <div class="card-footer">Diga <strong>"sí"</strong> para confirmar o <strong>"agregar"</strong> algo más</div>`;
  orderFloat.classList.add('visible');
  popSound();
}

// ---- Mostrar recomendaciones con imágenes ----
function showRecommendations(ids){
  const dishes = ids.map(id => MENU.find(d => d.id === id)).filter(Boolean);
  if(!dishes.length) return;
  orderFloat.classList.remove('visible');
  recoCard.innerHTML = `
    <div style="padding:10px 14px;font-weight:700;font-size:0.82rem;color:var(--gold);background:var(--gold-dim);">Le recomiendo</div>
    ${dishes.map(d => `
      <div class="order-item">
        ${d.img ? `<img src="${d.img}" alt="${d.name}">` : `<div class="emoji-thumb">${d.emoji}</div>`}
        <div class="info"><div class="name">${d.name}</div><div class="qty" style="color:var(--text-dim)">${d.desc}</div></div>
        <span class="price">$${d.price.toFixed(2)}</span>
      </div>`).join('')}
    <div style="padding:10px 14px;text-align:center;font-size:0.75rem;color:var(--text-dim);">Dígame cuál quiere o pida lo que guste</div>`;
  recoFloat.style.display = 'block';
  recoFloat.style.animation = 'floatIn .4s ease-out';
}

function hideRecommendations(){ recoFloat.style.display = 'none'; }

// ---- Confirmar pedido ----
function confirmOrder(){
  if(currentOrder.length === 0) return;
  audioCtx.resume(); dingSound();
  const total = currentOrder.reduce((s,l) => s + l.price*l.qty, 0);
  queue.push({
    num: orderCounter++, items: [...currentOrder], total,
    time: new Date().toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'}), status:'nuevo'
  });
  orderFloat.classList.remove('visible');
  showToast(`Pedido #${String(queue[queue.length-1].num).padStart(3,'0')} enviado ✓`);
  currentOrder = [];
  awaitingConfirmation = false;
  renderQueue();
  mascotSay('¡Pedido enviado! ¿Desea algo más, o le digo gracias?', () => listenLoop());
}

// ---- Procesar lo que dijo el cliente ----
function normalize(s){ return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

const GOODBYE = ['gracias','eso es todo','no nada mas','no nada más','ya no','hasta luego','chao','no gracias','nada mas','nada más'];
const CONFIRM = ['si','sí','confirma','confirmar','dale','eso','listo','mandalo','mándalo','correcto','esta bien','está bien'];
const DENY = ['no','cancel','cancela','quita','elimina','borra'];
const ADDMORE = ['agrega','tambien','también','ademas','además','mas','más','otro','otra','quiero','dame','deme','pon','ponme','y tambien','y también'];

async function handleInput(raw){
  if(!raw || !raw.trim()) return;
  const n = normalize(raw.trim());

  // Chequear despedida
  if(GOODBYE.some(w => n.includes(normalize(w))) && !n.includes('quiero') && !n.includes('dame')){
    endSession();
    return;
  }

  // Si esperamos confirmación
  if(awaitingConfirmation){
    if(CONFIRM.some(w => n.includes(normalize(w)))){
      awaitingConfirmation = false;
      confirmOrder();
      return;
    }
    if(DENY.some(w => n.includes(normalize(w))) && !ADDMORE.some(w => n.includes(normalize(w)))){
      awaitingConfirmation = false;
      currentOrder = [];
      orderFloat.classList.remove('visible');
      mascotSay('Cancelado. ¿Qué le sirvo entonces?', () => listenLoop());
      return;
    }
    // Si quiere agregar más, procesar como pedido nuevo
    awaitingConfirmation = false;
  }

  hideRecommendations();
  await processOrder(raw);
}

async function processOrder(raw){
  statusText.textContent = 'Procesando...';
  mascotWrap.classList.remove('listening','speaking');

  let result;
  try {
    const res = await fetch('/api/match', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ transcript: raw, menu: MENU.map(d => ({ id: d.id, name: d.name, desc: d.desc })) })
    });
    if(!res.ok) throw new Error('fail');
    result = await res.json();
  } catch(err) {
    // Fallback local
    result = { items: [], reply: 'Hubo un problema. ¿Puede repetir?' };
  }

  // Manejar items con cantidades
  if(result.items && result.items.length > 0){
    result.items.forEach(item => {
      const dish = MENU.find(d => d.id === item.id);
      if(!dish) return;
      const qty = item.qty || 1;
      const existing = currentOrder.find(l => l.id === item.id);
      if(existing) existing.qty += qty;
      else currentOrder.push({ ...dish, qty });
    });
    showOrderFloat();
    awaitingConfirmation = true;
    mascotSay((result.reply || '¡Aquí tiene!') + ' ¿Confirma el pedido?', () => listenLoop());
    return;
  }

  // Manejar recomendaciones
  if(result.suggest_ids && result.suggest_ids.length > 0){
    showRecommendations(result.suggest_ids);
    mascotSay(result.reply || '¡Le recomiendo estas opciones!', () => listenLoop());
    return;
  }

  // Sin match
  mascotSay(result.reply || '¿Qué le puedo ofrecer?', () => listenLoop());
}

// ---- Micrófono ----
let mediaRecorder = null, audioChunks = [];

async function startRecording(){
  if(recognizing || !sessionActive) return;
  audioCtx.resume();
  speechSynthesis.cancel();
  mascotWrap.classList.remove('speaking');

  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch(err) { mascotSay('No puedo escucharle. Permita el micrófono.'); return; }

  audioChunks = [];
  mediaRecorder = new MediaRecorder(stream, {
    mimeType: MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/mp4'
  });
  mediaRecorder.ondataavailable = (e) => { if(e.data.size > 0) audioChunks.push(e.data); };
  mediaRecorder.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    recognizing = false;
    clearInterval(recTimer);
    mascotWrap.classList.remove('listening');

    if(audioChunks.length === 0 || new Blob(audioChunks).size < 1000){
      if(sessionActive) listenLoop();
      return;
    }
    const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
    statusText.textContent = 'Pensando...';

    try {
      const fd = new FormData();
      fd.append('file', blob, 'audio.' + (mediaRecorder.mimeType.includes('webm') ? 'webm' : 'm4a'));
      const res = await fetch('/api/transcribe', { method: 'POST', body: fd });
      if(!res.ok) throw new Error('fail');
      const data = await res.json();
      if(data.text && data.text.trim()) handleInput(data.text.trim());
      else { mascotSay('No entendí, ¿puede repetir?', () => listenLoop()); }
    } catch(err) { mascotSay('Hubo un error. ¿Puede repetir?', () => listenLoop()); }
  };

  mediaRecorder.start();
  recognizing = true;
  let secs = 0;
  mascotWrap.classList.add('listening');
  mascotWrap.classList.remove('speaking');
  statusText.textContent = 'Escuchando...';
  recTimer = setInterval(() => { secs++; statusText.textContent = `Escuchando... ${secs}s`; }, 1000);
  setTimeout(() => { if(recognizing && mediaRecorder.state === 'recording') mediaRecorder.stop(); }, 8000);
}

// Tocar la mascota: si no hay sesion, iniciar. Si hay sesion y esta grabando, parar.
mascot.addEventListener('click', () => {
  audioCtx.resume();
  if(!sessionActive){
    startSession();
    return;
  }
  if(recognizing){
    mediaRecorder.stop();
  } else {
    speechSynthesis.cancel();
    mascotWrap.classList.remove('speaking');
    startRecording();
  }
});

// Toast
function showToast(msg){ toast.textContent = msg; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2800); }

// ---- Cajero ----
function renderQueue(){
  const ql = document.getElementById('queueList');
  const qc = document.getElementById('queueCount');
  qc.textContent = queue.length;
  if(!queue.length){ ql.innerHTML = '<div class="empty-queue">Sin pedidos</div>'; return; }
  ql.innerHTML = '';
  queue.forEach(order => {
    const card = document.createElement('div'); card.className = 'caj-card';
    card.innerHTML = `
      <div class="top"><span class="num">#${String(order.num).padStart(3,'0')}</span><span class="status">${order.status}</span><span class="time">${order.time}</span></div>
      ${order.items.map(i => `<div class="item"><span>${i.name} ×${i.qty}</span><span>$${(i.price*i.qty).toFixed(2)}</span></div>`).join('')}
      <div class="total"><span>Total</span><span class="amount">$${order.total.toFixed(2)}</span></div>
      <button class="ready-btn">Marcar listo</button>`;
    card.querySelector('.ready-btn').addEventListener('click', () => { queue = queue.filter(o => o.num !== order.num); renderQueue(); });
    ql.appendChild(card);
  });
}

// Tabs
const tabCajero = document.getElementById('tabCajero');
tabCajero.addEventListener('click', () => {
  const showing = document.getElementById('viewCajero').classList.contains('active');
  document.getElementById('viewCliente').classList.toggle('active', showing);
  document.getElementById('viewCajero').classList.toggle('active', !showing);
  tabCajero.classList.toggle('active', !showing);
  if(!showing) renderQueue();
});

// Init
renderQueue();
