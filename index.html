<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sabor Casero — Pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0D0D0D;--surface:rgba(255,255,255,0.04);--surface2:rgba(255,255,255,0.07);
  --glass:rgba(255,255,255,0.06);--glass-border:rgba(255,255,255,0.09);
  --text:#F0EDE8;--text-dim:rgba(240,237,232,0.5);--text-mid:rgba(240,237,232,0.72);
  --gold:#D4A853;--gold-dim:rgba(212,168,83,0.2);--green:#4A7C59;--green-dim:rgba(74,124,89,0.18);
  --red:#C14040;--font:'DM Sans',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;}
body{
  font-family:var(--font);background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;min-height:100%;
}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}

/* Header */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;padding-top:calc(16px + env(safe-area-inset-top,0px));
  position:sticky;top:0;z-index:10;
  background:rgba(13,13,13,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--glass-border);
}
.logo{font-weight:700;font-size:1.15rem;letter-spacing:-0.02em;}
.logo span{color:var(--gold);font-style:italic;}
.tabs{display:flex;gap:2px;background:var(--surface2);border-radius:8px;padding:3px;}
.tabs button{
  border:none;background:transparent;font-family:var(--font);font-weight:500;font-size:0.78rem;
  padding:7px 14px;border-radius:6px;color:var(--text-dim);cursor:pointer;transition:all .2s ease-out;
}
.tabs button.active{background:var(--gold);color:#0D0D0D;font-weight:700;}

/* Main */
main{flex:1;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);}
.view{display:none;flex:1;flex-direction:column;}
.view.active{display:flex;}

/* Chat */
.chat{flex:1;overflow-y:auto;padding:16px 16px 8px;display:flex;flex-direction:column;gap:8px;}
.msg{display:flex;gap:10px;max-width:88%;animation:msgIn .3s ease-out;}
.msg.user{align-self:flex-end;flex-direction:row-reverse;}
@keyframes msgIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.ai-avatar{
  width:32px;height:32px;border-radius:8px;flex-shrink:0;
  background:linear-gradient(135deg,var(--gold-dim),var(--surface2));
  display:flex;align-items:center;justify-content:center;
}
.ai-avatar svg{width:18px;height:18px;}
.bubble{
  padding:10px 14px;font-size:0.9rem;line-height:1.45;border-radius:4px 12px 12px 12px;
  background:var(--glass);border:1px solid var(--glass-border);color:var(--text);
}
.msg.user .bubble{
  border-radius:12px 4px 12px 12px;background:var(--gold-dim);
  border:1px solid rgba(212,168,83,0.15);color:var(--text);
}

/* Typing indicator */
.typing{display:flex;gap:4px;padding:12px 16px;}
.typing span{
  width:6px;height:6px;border-radius:50%;background:var(--text-dim);
  animation:blink 1.4s infinite both;
}
.typing span:nth-child(2){animation-delay:.2s;}
.typing span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.3;}40%{opacity:1;}}

/* Mic area */
.mic-area{
  padding:12px 16px 6px;display:flex;flex-direction:column;align-items:center;gap:10px;
}
.mic-ring{
  width:76px;height:76px;border-radius:50%;position:relative;
  display:flex;align-items:center;justify-content:center;
}
.mic-ring::before{
  content:'';position:absolute;inset:-4px;border-radius:50%;
  border:2px solid transparent;transition:border-color .3s ease-out;
}
.mic-ring.recording::before{
  border-color:var(--gold);animation:spin 2s linear infinite;
  border-top-color:transparent;
}
@keyframes spin{to{transform:rotate(360deg);}}
.mic-btn{
  width:64px;height:64px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(145deg,rgba(212,168,83,0.15),rgba(212,168,83,0.06));
  border:1px solid rgba(212,168,83,0.25);color:var(--gold);
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s ease-out,box-shadow .2s ease-out;
}
.mic-btn:active{transform:scale(0.93);}
.mic-btn.recording{
  background:linear-gradient(145deg,rgba(212,168,83,0.25),rgba(212,168,83,0.1));
  box-shadow:0 0 30px rgba(212,168,83,0.15);
}
.mic-btn svg{width:24px;height:24px;fill:currentColor;}
.mic-label{font-size:0.75rem;color:var(--text-dim);font-weight:500;text-align:center;min-height:18px;}

/* Audio wave */
.wave{display:flex;gap:3px;align-items:center;height:24px;opacity:0;transition:opacity .2s ease-out;}
.wave.active{opacity:1;}
.wave span{
  width:3px;border-radius:2px;background:var(--gold);
  animation:wave 1s ease-in-out infinite;
}
.wave span:nth-child(1){height:8px;animation-delay:0s;}
.wave span:nth-child(2){height:16px;animation-delay:.1s;}
.wave span:nth-child(3){height:24px;animation-delay:.2s;}
.wave span:nth-child(4){height:16px;animation-delay:.3s;}
.wave span:nth-child(5){height:8px;animation-delay:.4s;}
@keyframes wave{0%,100%{transform:scaleY(.4);}50%{transform:scaleY(1);}}

/* Text input */
.input-bar{
  display:flex;gap:8px;padding:8px 16px 12px;
}
.input-bar input{
  flex:1;padding:10px 14px;border-radius:10px;
  background:var(--surface2);border:1px solid var(--glass-border);
  color:var(--text);font-family:var(--font);font-size:0.88rem;
  outline:none;transition:border-color .2s ease-out;
}
.input-bar input::placeholder{color:var(--text-dim);}
.input-bar input:focus{border-color:rgba(212,168,83,0.3);}
.input-bar button{
  border:none;background:var(--surface2);color:var(--gold);font-weight:700;
  padding:0 16px;border-radius:10px;cursor:pointer;font-family:var(--font);font-size:0.82rem;
  transition:transform .15s ease-out;
}
.input-bar button:active{transform:scale(0.95);}
.voice-note{font-size:0.72rem;color:var(--text-dim);text-align:center;padding:0 16px 4px;}

/* Food cards */
.cards{display:flex;flex-direction:column;gap:8px;padding:4px 16px 12px;}
.dish-card{
  display:flex;align-items:center;gap:12px;
  background:var(--glass);border:1px solid var(--glass-border);
  border-radius:10px;padding:10px;cursor:pointer;
  transition:transform .2s ease-out,border-color .2s ease-out;
  animation:cardIn .35s ease-out backwards;
}
.dish-card:nth-child(1){animation-delay:0s;}
.dish-card:nth-child(2){animation-delay:.08s;}
.dish-card:nth-child(3){animation-delay:.16s;}
@keyframes cardIn{from{opacity:0;transform:translateX(-8px);}to{opacity:1;transform:translateX(0);}}
.dish-card:active{transform:scale(0.98);}
.dish-card:hover{border-color:rgba(212,168,83,0.2);}
.dish-img{
  width:64px;height:64px;border-radius:8px;object-fit:cover;flex-shrink:0;
  background:var(--surface2);
}
.dish-img-fallback{
  width:64px;height:64px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:1.6rem;
}
.dish-info{flex:1;min-width:0;}
.dish-info h3{font-weight:700;font-size:0.92rem;margin-bottom:2px;letter-spacing:-0.01em;}
.dish-info p{font-size:0.78rem;color:var(--text-dim);line-height:1.3;}
.dish-price{color:var(--gold);font-weight:700;font-size:0.85rem;margin-top:3px;}
.add-btn{
  border:none;background:var(--gold-dim);color:var(--gold);font-weight:700;
  font-size:0.75rem;padding:8px 12px;border-radius:8px;cursor:pointer;flex-shrink:0;
  font-family:var(--font);transition:transform .15s ease-out;
}
.add-btn:active{transform:scale(0.9);}
.add-btn.added{background:var(--green-dim);color:var(--green);}

/* Order panel */
.order-panel{
  background:rgba(13,13,13,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--glass-border);padding:14px 16px;
  padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
  animation:slideUp .3s ease-out;
}
@keyframes slideUp{from{transform:translateY(100%);opacity:0;}to{transform:translateY(0);opacity:1;}}
.order-panel h4{font-weight:700;font-size:0.88rem;margin-bottom:8px;color:var(--text-mid);}
.order-line{display:flex;align-items:center;justify-content:space-between;padding:4px 0;font-size:0.85rem;}
.order-line .qty-controls{display:flex;align-items:center;gap:8px;}
.qty-btn{
  width:24px;height:24px;border-radius:6px;border:1px solid var(--glass-border);
  background:var(--surface2);color:var(--text);font-size:0.8rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-family:var(--font);
}
.qty-btn:active{transform:scale(0.9);}
.order-total{
  display:flex;justify-content:space-between;font-weight:700;font-size:0.95rem;
  border-top:1px solid var(--glass-border);margin-top:8px;padding-top:8px;
}
.order-total .amount{color:var(--gold);}
.confirm-btn{
  width:100%;margin-top:10px;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--gold),#B8913D);color:#0D0D0D;
  font-weight:700;padding:13px;border-radius:10px;font-size:0.9rem;font-family:var(--font);
  transition:transform .15s ease-out,box-shadow .2s ease-out;
}
.confirm-btn:active{transform:scale(0.97);}
.confirm-btn:disabled{opacity:0.3;cursor:not-allowed;}

/* Toast */
.toast{
  position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));
  transform:translate(-50%,120%);z-index:30;
  background:rgba(74,124,89,0.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  color:#fff;padding:12px 20px;border-radius:10px;font-weight:700;font-size:0.85rem;
  box-shadow:0 8px 32px rgba(0,0,0,0.4);transition:transform .3s ease-out;max-width:90%;text-align:center;
}
.toast.show{transform:translate(-50%,0);}

/* Cajero */
.cajero-header{display:flex;align-items:baseline;justify-content:space-between;padding:16px;margin-bottom:4px;}
.cajero-header h2{font-weight:700;font-size:1.05rem;}
.badge{
  font-size:0.7rem;font-weight:700;background:var(--gold-dim);color:var(--gold);
  padding:3px 8px;border-radius:20px;
}
.order-card{
  background:var(--glass);border:1px solid var(--glass-border);
  border-radius:10px;padding:14px 16px;margin:0 16px 10px;
  animation:cardIn .35s ease-out;
}
.order-card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.order-card .num{font-weight:700;font-size:0.95rem;}
.order-card .time{font-size:0.72rem;color:var(--text-dim);}
.order-card .status{
  font-size:0.68rem;font-weight:700;padding:3px 8px;border-radius:20px;
  background:var(--gold-dim);color:var(--gold);
}
.order-card .item{display:flex;justify-content:space-between;font-size:0.85rem;padding:2px 0;color:var(--text-mid);}
.order-card .total{
  display:flex;justify-content:space-between;font-weight:700;margin-top:6px;
  padding-top:6px;border-top:1px solid var(--glass-border);
}
.order-card .total .amount{color:var(--gold);}
.ready-btn{
  width:100%;margin-top:10px;border:none;background:var(--green-dim);color:var(--green);
  font-weight:700;padding:10px;border-radius:8px;cursor:pointer;font-size:0.82rem;font-family:var(--font);
  transition:transform .15s ease-out;
}
.ready-btn:active{transform:scale(0.97);}
.empty-queue{text-align:center;color:var(--text-dim);font-size:0.88rem;padding:48px 20px;}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">Sabor <span>Casero</span></div>
    <div class="tabs">
      <button id="tabCliente" class="active">Cliente</button>

    </div>
  </header>

  <main>
    <section id="viewCliente" class="view active">

          </button>
        </div>
        <div class="mic-label" id="micLabel">Toque para hablar</div>
      </div>

      <div class="input-bar">
        <input id="textInput" type="text" placeholder="O escriba su pedido...">
        <button id="sendBtn">Enviar</button>
      </div>
      <div class="voice-note" id="voiceNote"></div>
    </section>

    <section id="viewCajero" class="view">
      <div class="cajero-header">
        <h2>Pedidos</h2>
        <span class="badge" id="queueCount">0</span>
      </div>
      <div id="queueList" style="flex:1;overflow-y:auto;"></div>
    </section>
  </main>
</div>
<div class="toast" id="toast"></div>

const CHEF_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="rgba(212,168,83,0.7)" stroke-width="1.5" stroke-linecap="round"><path d="M12 2C9.5 2 7.5 4 7.5 6.5c0 .5.1 1 .3 1.4C6.1 8.5 5 10 5 11.5 5 13.4 6.6 15 8.5 15h7c1.9 0 3.5-1.6 3.5-3.5 0-1.5-1.1-3-2.8-3.6.2-.4.3-.9.3-1.4C16.5 4 14.5 2 12 2z"/><path d="M9 15v5c0 1.1.9 2 2 2h2c1.1 0 2-.9 2-2v-5"/></svg>`;

function dishVisual(dish){
  if(dish.img){
    return `<img class="dish-img" src="${dish.img}" alt="${dish.name}">`;
  }
  return `<div class="dish-img-fallback" style="background:linear-gradient(135deg,${dish.color}22,${dish.color}08);">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="${dish.color}" opacity="0.6"><circle cx="12" cy="12" r="8"/></svg>
  </div>`;
}

function addMessage(text, who){
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  if(who === 'ai'){
    div.innerHTML = `<div class="ai-avatar">${CHEF_SVG}</div><div class="bubble">${text}</div>`;
  } else {
    div.innerHTML = `<div class="bubble">${text}</div>`;
  }
  chat.appendChild(div);
  chat.scrollTo({top:chat.scrollHeight,behavior:'smooth'});
}

function showTyping(){
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.id = 'typingIndicator';
  div.innerHTML = `<div class="ai-avatar">${CHEF_SVG}</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  chat.appendChild(div);
  chat.scrollTo({top:chat.scrollHeight,behavior:'smooth'});
}
function hideTyping(){
  const el = document.getElementById('typingIndicator');
  if(el) el.remove();
}

function speak(text){
  if(!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'es-ES';
  const voices = speechSynthesis.getVoices();
  const esVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('es'));
  if(esVoice) u.voice = esVoice;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

function aiSay(text){
  hideTyping();
  addMessage(text, 'ai');
  speak(text);
}

function normalize(s){
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}

const UNSURE_WORDS = ['no se','no sé','no tengo idea','sugiereme','sugiérame','recomiend','sorprend','que hay','qué hay','algo rico','algo bueno'];

function localMatch(raw){
  const n = normalize(raw);
  if(UNSURE_WORDS.some(w => n.includes(normalize(w)))){
    return { matched_ids: [], suggest: true, reply: 'Sin problema, le recomiendo estos:' };
  }
  const matches = MENU.filter(d => d.kw.some(k => n.includes(normalize(k))));
  if(matches.length){
    return {
      matched_ids: matches.slice(0,3).map(d => d.id), suggest: false,
      reply: matches.length === 1 ? `Encontré esto: ${matches[0].name}.` : 'Encontré estas opciones:'
    };
  }
  return { matched_ids: [], suggest: true, reply: 'No encontré eso en el menú. ¿Le muestro algunas opciones?' };
}

async function handleInput(raw){
  if(!raw || !raw.trim()) return;
  addMessage(raw, 'user');
  showTyping();
  setBusy(true);

  let result;
  try {
    const res = await fetch('/api/match', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        transcript: raw,
        menu: MENU.map(d => ({ id: d.id, name: d.name, desc: d.desc }))
      })
    });
    if(!res.ok) throw new Error('match API failed');
    result = await res.json();
  } catch(err) {
    result = localMatch(raw);
  }

  setBusy(false);
  aiSay(result.reply || 'Déjeme ver qué tenemos...');

  if(result.suggest || !result.matched_ids || result.matched_ids.length === 0){
    showCards(shuffle(MENU).slice(0,3));
  } else {
    const matched = result.matched_ids.map(id => MENU.find(d => d.id === id)).filter(Boolean);
    showCards(matched.length ? matched : shuffle(MENU).slice(0,3));
  }
}

function setBusy(busy){
  micBtn.disabled = busy;
  sendBtn.disabled = busy;
  if(busy) micLabel.textContent = '';
}

function shuffle(arr){ return [...arr].sort(() => Math.random() - 0.5); }

function showCards(list){
  suggestionCards.innerHTML = '';
  list.forEach(dish => {
    const card = document.createElement('div');
    card.className = 'dish-card';
    card.innerHTML = `
      ${dishVisual(dish)}
      <div class="dish-info">
        <h3>${dish.name}</h3>
        <p>${dish.desc}</p>
        <div class="dish-price">$${dish.price.toFixed(2)}</div>
      </div>
      <button class="add-btn" data-id="${dish.id}">Agregar</button>`;
    const btn = card.querySelector('.add-btn');
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      selectDish(dish);
      btn.textContent = '✓';
      btn.classList.add('added');
      setTimeout(() => { btn.textContent = 'Agregar'; btn.classList.remove('added'); }, 800);
    });
    suggestionCards.appendChild(card);
  });
  chat.scrollTo({top:chat.scrollHeight,behavior:'smooth'});
}

function selectDish(dish){
  const existing = currentOrder.find(l => l.id === dish.id);
  if(existing) existing.qty += 1;
  else currentOrder.push({ ...dish, qty:1 });
  renderOrder();
  aiSay(`${dish.name} agregado. ¿Algo más?`);
  suggestionCards.innerHTML = '';
}

function renderOrder(){
  if(currentOrder.length === 0){ orderPanel.innerHTML = ''; return; }
  const total = currentOrder.reduce((s,l) => s + l.price*l.qty, 0);
  orderPanel.innerHTML = `
    <div class="order-panel">
      <h4>Su pedido</h4>
      ${currentOrder.map((l,i) => `
        <div class="order-line">
          <span>${l.name}</span>
          <div class="qty-controls">
            <button class="qty-btn" data-action="dec" data-idx="${i}">−</button>
            <span>${l.qty}</span>
            <button class="qty-btn" data-action="inc" data-idx="${i}">+</button>
            <span style="width:50px;text-align:right;color:var(--gold);">$${(l.price*l.qty).toFixed(2)}</span>
          </div>
        </div>`).join('')}
      <div class="order-total"><span>Total</span><span class="amount">$${total.toFixed(2)}</span></div>
      <button class="confirm-btn" id="confirmBtn">Confirmar pedido</button>
    </div>`;
  orderPanel.querySelectorAll('.qty-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.idx);
      if(btn.dataset.action === 'inc') currentOrder[idx].qty += 1;
      else {
        currentOrder[idx].qty -= 1;
        if(currentOrder[idx].qty <= 0) currentOrder.splice(idx, 1);
      }
      renderOrder();
    });
  });
  document.getElementById('confirmBtn').addEventListener('click', confirmOrder);
}

function confirmOrder(){
  if(currentOrder.length === 0) return;
  const total = currentOrder.reduce((s,l) => s + l.price*l.qty, 0);
  const order = {
    num: orderCounter++,
    items: [...currentOrder],
    total,
    time: new Date().toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'}),
    status: 'nuevo'
  };
  queue.push(order);
  showToast(`Pedido #${String(order.num).padStart(3,'0')} enviado`);
  aiSay('Pedido enviado a caja. ¡Gracias!');
  currentOrder = [];
  renderOrder();
  suggestionCards.innerHTML = '';
  renderQueue();
}

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2400);
}

// ---------- Micrófono (MediaRecorder + Whisper via Groq) ----------
let mediaRecorder = null;
let audioChunks = [];

micBtn.addEventListener('click', async () => {
  if(recognizing){
    mediaRecorder.stop();
    return;
  }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch(err) {
    micLabel.textContent = 'Micrófono bloqueado';
    voiceNote.textContent = 'Toque el candado en la barra de direcciones y permita el micrófono.';
    return;
  }
  audioChunks = [];
  mediaRecorder = new MediaRecorder(stream, {
    mimeType: MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/mp4'
  });
  mediaRecorder.ondataavailable = (e) => { if(e.data.size > 0) audioChunks.push(e.data); };
  mediaRecorder.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    recognizing = false;
    micBtn.classList.remove('recording');
    micRing.classList.remove('recording');
    wave.classList.remove('active');

    if(audioChunks.length === 0){ micLabel.textContent = 'No se grabó audio'; return; }
    const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
    if(blob.size < 1000){ micLabel.textContent = 'Muy corto — mantenga mientras habla'; return; }

    micLabel.textContent = '';
    showTyping();
    setBusy(true);
    try {
      const fd = new FormData();
      const ext = mediaRecorder.mimeType.includes('webm') ? 'webm' : 'm4a';
      fd.append('file', blob, 'audio.' + ext);
      const res = await fetch('/api/transcribe', { method: 'POST', body: fd });
      if(!res.ok) throw new Error('transcribe failed');
      const data = await res.json();
      setBusy(false);
      hideTyping();
      if(data.text && data.text.trim()){
        micLabel.textContent = 'Toque para hablar';
        handleInput(data.text.trim());
      } else {
        micLabel.textContent = 'No entendí — intente de nuevo';
      }
    } catch(err) {
      setBusy(false);
      hideTyping();
      micLabel.textContent = 'Error — use el campo de texto';
    }
  };
  mediaRecorder.start();
  recognizing = true;
  micBtn.classList.add('recording');
  micRing.classList.add('recording');
  wave.classList.add('active');
  micLabel.textContent = 'Escuchando... toque para enviar';
  setTimeout(() => { if(recognizing && mediaRecorder.state === 'recording') mediaRecorder.stop(); }, 10000);
});

sendBtn.addEventListener('click', () => { handleInput(textInput.value); textInput.value = ''; });
textInput.addEventListener('keydown', (e) => { if(e.key === 'Enter'){ handleInput(textInput.value); textInput.value = ''; } });

// ---------- Vista cajero ----------
function renderQueue(){
  const queueList = document.getElementById('queueList');
  const queueCount = document.getElementById('queueCount');
  queueCount.textContent = queue.length;
  if(queue.length === 0){
    queueList.innerHTML = '<div class="empty-queue">Sin pedidos en cola</div>';
    return;
  }
  queueList.innerHTML = '';
  queue.forEach(order => {
    const card = document.createElement('div');
    card.className = 'order-card';
    card.innerHTML = `
      <div class="top">
        <span class="num">#${String(order.num).padStart(3,'0')}</span>
        <span class="status">${order.status}</span>
        <span class="time">${order.time}</span>
      </div>
      ${order.items.map(i => `<div class="item"><span>${i.name} ×${i.qty}</span><span>$${(i.price*i.qty).toFixed(2)}</span></div>`).join('')}
      <div class="total"><span>Total</span><span class="amount">$${order.total.toFixed(2)}</span></div>
      <button class="ready-btn">Marcar listo</button>`;
    card.querySelector('.ready-btn').addEventListener('click', () => {
      queue = queue.filter(o => o.num !== order.num);
      renderQueue();
    });
    queueList.appendChild(card);
  });
}

// ---------- Tabs ----------
document.getElementById('tabCliente').addEventListener('click', () => switchTab('Cliente'));
document.getElementById('tabCajero').addEventListener('click', () => switchTab('Cajero'));
function switchTab(name){
  document.getElementById('tabCliente').classList.toggle('active', name === 'Cliente');
  document.getElementById('tabCajero').classList.toggle('active', name === 'Cajero');
  document.getElementById('viewCliente').classList.toggle('active', name === 'Cliente');
  document.getElementById('viewCajero').classList.toggle('active', name === 'Cajero');
  if(name === 'Cajero') renderQueue();
}

renderQueue();
