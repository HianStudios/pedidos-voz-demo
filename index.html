<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sabor Casero — Pedidos por voz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F2E8D8; --surface:#FFF8EF; --surface2:#FBEFE0; --text:#2B1B14; --text-dim:#6B5546;
    --accent:#C1440E; --accent2:#E8A33D; --success:#4C7A4C; --border:rgba(43,27,20,0.15);
    --font-display:'Fraunces', serif; --font-body:'Manrope', sans-serif;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#241510; --surface:#3A281F; --surface2:#4A3528; --text:#F5EDE3; --text-dim:#CBB9A8;
      --accent:#E8622F; --accent2:#F0B84D; --success:#6FA86E; --border:rgba(245,237,227,0.14);
    }
  }
  :root[data-theme="dark"]{
    --bg:#241510; --surface:#3A281F; --surface2:#4A3528; --text:#F5EDE3; --text-dim:#CBB9A8;
    --accent:#E8622F; --accent2:#F0B84D; --success:#6FA86E; --border:rgba(245,237,227,0.14);
  }
  html{ scroll-padding-top:env(safe-area-inset-top,0px); }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body);
    min-height:100%; -webkit-font-smoothing:antialiased;
  }
  .app{ max-width:620px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px calc(14px + env(safe-area-inset-top,0px));
    position:sticky; top:0; background:var(--bg); z-index:5; border-bottom:1px solid var(--border);
  }
  header h1{ font-family:var(--font-display); font-weight:600; font-size:1.3rem; margin:0; letter-spacing:-0.01em; }
  header h1 span{ color:var(--accent); font-style:italic; }
  .tabs{ display:flex; gap:4px; background:var(--surface2); border-radius:999px; padding:4px; }
  .tabs button{
    border:none; background:transparent; font-family:var(--font-body); font-weight:700; font-size:0.78rem;
    padding:8px 14px; border-radius:999px; color:var(--text-dim); cursor:pointer; transition:all .2s ease;
  }
  .tabs button.active{ background:var(--accent); color:#fff; }

  main{ flex:1; padding:8px 20px 140px; }
  .view{ display:none; }
  .view.active{ display:block; }

  /* ---- Vista cliente ---- */
  .greeting{ display:flex; gap:12px; align-items:flex-start; margin:18px 0 22px; }
  .avatar{
    width:40px; height:40px; border-radius:50%; background:var(--accent); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:1.1rem;
  }
  .bubble{
    background:var(--surface); border:1px solid var(--border); border-radius:4px 16px 16px 16px;
    padding:12px 16px; font-size:0.98rem; line-height:1.45; max-width:85%;
  }
  .bubble.user{ margin-left:auto; background:var(--accent2); color:#2B1B14; border-radius:16px 4px 16px 16px; border:none; }
  .log{ display:flex; flex-direction:column; gap:10px; margin-bottom:18px; }
  .log .row{ display:flex; }
  .log .row.user{ justify-content:flex-end; }

  .mic-wrap{ display:flex; flex-direction:column; align-items:center; gap:14px; margin:20px 0 26px; }
  .mic-btn{
    width:84px; height:84px; border-radius:50%; border:none; background:var(--accent); color:#fff;
    font-size:1.9rem; cursor:pointer; display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 24px rgba(0,0,0,0.18); transition:transform .15s ease;
  }
  .mic-btn:active{ transform:scale(0.95); }
  .mic-btn.listening{ animation:pulse 1.1s infinite; background:var(--success); }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(76,122,76,0.45); }
    70%{ box-shadow:0 0 0 18px rgba(76,122,76,0); }
    100%{ box-shadow:0 0 0 0 rgba(76,122,76,0); }
  }
  .mic-label{ font-size:0.82rem; color:var(--text-dim); font-weight:600; }

  .text-fallback{ display:flex; gap:8px; margin-bottom:6px; }
  .text-fallback input{
    flex:1; padding:12px 14px; border-radius:12px; border:1px solid var(--border); background:var(--surface);
    color:var(--text); font-family:var(--font-body); font-size:0.95rem;
  }
  .text-fallback button{
    border:none; background:var(--surface2); color:var(--text); font-weight:700; padding:0 16px;
    border-radius:12px; cursor:pointer; font-family:var(--font-body); font-size:0.85rem;
  }
  .no-voice-note{ font-size:0.78rem; color:var(--text-dim); text-align:center; margin-bottom:10px; }

  .cards{ display:grid; grid-template-columns:1fr; gap:10px; margin:14px 0 20px; animation:reveal .35s ease; }
  @keyframes reveal{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:translateY(0);} }
  .dish-card{
    display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border);
    border-radius:14px; padding:12px;
  }
  .dish-card .info{ flex:1; min-width:0; }
  .dish-card .info h3{ margin:0 0 2px; font-family:var(--font-display); font-weight:600; font-size:1.02rem; }
  .dish-card .info p{ margin:0; font-size:0.82rem; color:var(--text-dim); line-height:1.3; }
  .dish-card .price{ font-weight:800; font-size:0.9rem; margin-top:4px; color:var(--accent); }
  .dish-card button{
    border:none; background:var(--accent); color:#fff; font-weight:700; font-size:0.8rem;
    padding:9px 14px; border-radius:10px; cursor:pointer; flex-shrink:0;
  }

  .order-summary{
    background:var(--surface2); border-radius:14px; padding:14px 16px; margin-top:10px;
  }
  .order-summary h4{ margin:0 0 8px; font-family:var(--font-display); font-weight:600; font-size:0.98rem; }
  .order-line{ display:flex; justify-content:space-between; font-size:0.9rem; padding:4px 0; }
  .order-total{ display:flex; justify-content:space-between; font-weight:800; border-top:1px solid var(--border); margin-top:6px; padding-top:8px; }
  .confirm-btn{
    width:100%; margin-top:12px; border:none; background:var(--success); color:#fff; font-weight:800;
    padding:13px; border-radius:12px; cursor:pointer; font-size:0.95rem; font-family:var(--font-body);
  }
  .confirm-btn:disabled{ opacity:0.4; cursor:not-allowed; }

  .toast{
    position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translate(-50%,120%);
    background:var(--success); color:#fff; padding:13px 20px; border-radius:12px; font-weight:700;
    font-size:0.88rem; box-shadow:0 10px 28px rgba(0,0,0,0.25); transition:transform .3s ease; z-index:20;
    max-width:90%; text-align:center;
  }
  .toast.show{ transform:translate(-50%,0); }

  /* ---- Vista cajero ---- */
  .cajero-header{ display:flex; align-items:baseline; justify-content:space-between; margin:16px 0; }
  .cajero-header h2{ font-family:var(--font-display); font-weight:600; font-size:1.1rem; margin:0; }
  .queue-count{ font-size:0.82rem; color:var(--text-dim); font-weight:600; }
  .order-card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 16px; margin-bottom:12px;
  }
  .order-card .top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
  .order-card .top .num{ font-family:var(--font-display); font-weight:600; font-size:1.05rem; }
  .order-card .top .time{ font-size:0.78rem; color:var(--text-dim); }
  .order-card .item{ display:flex; justify-content:space-between; font-size:0.88rem; padding:2px 0; }
  .order-card .total{ display:flex; justify-content:space-between; font-weight:800; margin-top:6px; padding-top:6px; border-top:1px solid var(--border); }
  .ready-btn{
    width:100%; margin-top:10px; border:none; background:var(--accent); color:#fff; font-weight:700;
    padding:10px; border-radius:10px; cursor:pointer; font-size:0.85rem; font-family:var(--font-body);
  }
  .empty-queue{ text-align:center; color:var(--text-dim); font-size:0.9rem; padding:40px 20px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Sabor <span>Casero</span></h1>
    <div class="tabs">
      <button id="tabCliente" class="active">Cliente</button>
      <button id="tabCajero">Cajero</button>
    </div>
  </header>

  <main>
    <!-- VISTA CLIENTE -->
    <section id="viewCliente" class="view active">
      <div class="log" id="log"></div>

      <div class="mic-wrap">
        <button class="mic-btn" id="micBtn">🎙️</button>
        <div class="mic-label" id="micLabel">Toque para hablar</div>
      </div>

      <div class="text-fallback">
        <input id="textInput" type="text" placeholder="O escriba lo que se le antoja...">
        <button id="sendBtn">Enviar</button>
      </div>
      <div class="no-voice-note" id="voiceNote"></div>

      <div class="cards" id="suggestionCards"></div>

      <div class="order-summary" id="orderSummary" style="display:none;">
        <h4>Su pedido</h4>
        <div id="orderLines"></div>
        <div class="order-total"><span>Total</span><span id="orderTotal">$0.00</span></div>
        <button class="confirm-btn" id="confirmBtn">Confirmar pedido</button>
      </div>
    </section>

    <!-- VISTA CAJERO -->
    <section id="viewCajero" class="view">
      <div class="cajero-header">
        <h2>Pedidos en cola</h2>
        <span class="queue-count" id="queueCount">0 pedidos</span>
      </div>
      <div id="queueList"></div>
    </section>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
// ---------- Datos de menú (placeholder — reemplazar con el menú real) ----------
const MENU = [
  { id:1, name:'Seco de pollo', price:3.50, desc:'Pollo guisado con arroz, maduro y aguacate', color:'#C1440E', kw:['seco de pollo','seco','pollo'] },
  { id:2, name:'Encebollado', price:3.00, desc:'Sopa de pescado con yuca y cebolla curtida', color:'#4C7A4C', kw:['encebollado','pescado','sopa de pescado'] },
  { id:3, name:'Ceviche de camarón', price:4.50, desc:'Camarón marinado en limón con canguil', color:'#E8A33D', kw:['ceviche','camaron','camarón'] },
  { id:4, name:'Bolón de verde', price:2.00, desc:'Bolón mixto con queso y chicharrón', color:'#B07A2E', kw:['bolon','bolón','verde'] },
  { id:5, name:'Caldo de manguera', price:3.50, desc:'Caldo tradicional de manguera de cerdo', color:'#8C4A2E', kw:['caldo de manguera','manguera','caldo'] },
  { id:6, name:'Arroz con menestra y carne', price:3.00, desc:'Arroz, menestra de lenteja y carne asada', color:'#6B8E3D', kw:['menestra','arroz con menestra','carne asada','carne'] }
];

// ---------- Estado ----------
let currentOrder = [];
let queue = [];
let orderCounter = 1;
let recognizing = false;

const log = document.getElementById('log');
const micBtn = document.getElementById('micBtn');
const micLabel = document.getElementById('micLabel');
const textInput = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');
const suggestionCards = document.getElementById('suggestionCards');
const orderSummary = document.getElementById('orderSummary');
const orderLines = document.getElementById('orderLines');
const orderTotal = document.getElementById('orderTotal');
const confirmBtn = document.getElementById('confirmBtn');
const toast = document.getElementById('toast');
const voiceNote = document.getElementById('voiceNote');

function dishIcon(color){
  return `<svg viewBox="0 0 64 64" width="46" height="46" aria-hidden="true" style="flex-shrink:0;">
    <circle cx="32" cy="32" r="27" fill="var(--surface2)" stroke="${color}" stroke-width="3"/>
    <ellipse cx="32" cy="35" rx="15" ry="9" fill="${color}" opacity="0.88"/>
    <ellipse cx="26" cy="29" rx="5" ry="4" fill="${color}" opacity="0.55"/>
  </svg>`;
}

function addBubble(text, who){
  const row = document.createElement('div');
  row.className = 'row ' + (who === 'user' ? 'user' : '');
  const inner = who === 'user'
    ? `<div class="bubble user">${text}</div>`
    : `<div class="avatar">🍲</div><div class="bubble">${text}</div>`;
  row.innerHTML = inner;
  if(who === 'ai'){ row.style.display='flex'; row.style.gap='12px'; }
  log.appendChild(row);
  log.scrollIntoView({block:'end'});
  return text;
}

function speak(text){
  if(!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'es-ES';
  const voices = speechSynthesis.getVoices();
  const esVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('es'));
  if(esVoice) u.voice = esVoice;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

function aiSay(text){
  addBubble(text, 'ai');
  speak(text);
}

function normalize(s){
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}

const UNSURE_WORDS = ['no se','no sé','no tengo idea','sugiereme','sugiérame','recomiend','sorprend','que hay','qué hay','algo rico','algo bueno'];

// Respaldo local (sin IA) por si /api/match falla o no hay conexión
function localMatch(raw){
  const n = normalize(raw);
  if(UNSURE_WORDS.some(w => n.includes(normalize(w)))){
    return { matched_ids: [], suggest: true, reply: 'Sin problema, le recomiendo estos:' };
  }
  const matches = MENU.filter(d => d.kw.some(k => n.includes(normalize(k))));
  if(matches.length){
    return {
      matched_ids: matches.slice(0,3).map(d => d.id), suggest: false,
      reply: matches.length === 1 ? `Encontré esto: ${matches[0].name}.` : 'Encontré estas opciones:'
    };
  }
  return { matched_ids: [], suggest: true, reply: 'No encontré eso en el menú. ¿Le muestro algunas opciones?' };
}

async function handleInput(raw){
  if(!raw || !raw.trim()) return;
  addBubble(raw, 'user');
  setBusy(true);

  let result;
  try {
    const res = await fetch('/api/match', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        transcript: raw,
        menu: MENU.map(d => ({ id: d.id, name: d.name, desc: d.desc }))
      })
    });
    if(!res.ok) throw new Error('match API failed');
    result = await res.json();
  } catch(err) {
    result = localMatch(raw); // respaldo local si el endpoint falla
  }

  setBusy(false);
  aiSay(result.reply || 'Déjeme ver qué tenemos...');

  if(result.suggest || !result.matched_ids || result.matched_ids.length === 0){
    showCards(shuffle(MENU).slice(0,3));
  } else {
    const matched = result.matched_ids.map(id => MENU.find(d => d.id === id)).filter(Boolean);
    showCards(matched.length ? matched : shuffle(MENU).slice(0,3));
  }
}

function setBusy(busy){
  micBtn.disabled = busy;
  sendBtn.disabled = busy;
  micLabel.textContent = busy ? 'Pensando...' : 'Toque para hablar';
}

function shuffle(arr){ return [...arr].sort(() => Math.random() - 0.5); }

function showCards(list){
  suggestionCards.innerHTML = '';
  list.forEach(dish => {
    const card = document.createElement('div');
    card.className = 'dish-card';
    card.innerHTML = `
      ${dishIcon(dish.color)}
      <div class="info">
        <h3>${dish.name}</h3>
        <p>${dish.desc}</p>
        <div class="price">$${dish.price.toFixed(2)}</div>
      </div>
      <button>Elegir</button>`;
    card.querySelector('button').addEventListener('click', () => selectDish(dish));
    suggestionCards.appendChild(card);
  });
}

function selectDish(dish){
  const existing = currentOrder.find(l => l.id === dish.id);
  if(existing) existing.qty += 1;
  else currentOrder.push({ ...dish, qty:1 });
  renderOrder();
  aiSay(`Agregué ${dish.name} a su pedido. ¿Desea algo más, o confirmamos?`);
  suggestionCards.innerHTML = '';
}

function renderOrder(){
  if(currentOrder.length === 0){ orderSummary.style.display = 'none'; return; }
  orderSummary.style.display = 'block';
  orderLines.innerHTML = currentOrder.map(l =>
    `<div class="order-line"><span>${l.name} x${l.qty}</span><span>$${(l.price*l.qty).toFixed(2)}</span></div>`
  ).join('');
  const total = currentOrder.reduce((s,l) => s + l.price*l.qty, 0);
  orderTotal.textContent = '$' + total.toFixed(2);
  confirmBtn.disabled = false;
}

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2600);
}

confirmBtn.addEventListener('click', () => {
  if(currentOrder.length === 0) return;
  const total = currentOrder.reduce((s,l) => s + l.price*l.qty, 0);
  const order = { num: orderCounter++, items: currentOrder, total, time: new Date().toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'}) };
  queue.push(order);
  showToast(`Pedido #${String(order.num).padStart(3,'0')} enviado a caja ✅`);
  aiSay('Perfecto, su pedido ya está en caja. ¡Gracias!');
  currentOrder = [];
  renderOrder();
  suggestionCards.innerHTML = '';
  renderQueue();
});

// ---------- Reconocimiento de voz ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let langIndex = 0;
const LANGS = ['es-419','es-ES','es']; // fallback chain: latam → españa → genérico

if(SR){
  recognition = new SR();
  recognition.lang = LANGS[langIndex];
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = () => {
    recognizing = true;
    micBtn.classList.add('listening');
    micLabel.textContent = 'Escuchando...';
  };

  recognition.onend = () => {
    recognizing = false;
    micBtn.classList.remove('listening');
    if(micLabel.textContent === 'Escuchando...') micLabel.textContent = 'Toque para hablar';
  };

  recognition.onerror = (e) => {
    recognizing = false;
    micBtn.classList.remove('listening');
    console.error('SpeechRecognition error:', e.error);

    switch(e.error){
      case 'not-allowed':
      case 'service-not-allowed':
        micLabel.textContent = 'Micrófono bloqueado — toque el candado en la barra de direcciones y permítalo';
        voiceNote.textContent = 'El navegador bloqueó el micrófono. Haga clic en el ícono de candado (🔒) arriba a la izquierda, busque Micrófono y cambie a Permitir, luego recargue la página.';
        break;
      case 'language-not-supported':
        // Probar el siguiente idioma del fallback
        langIndex++;
        if(langIndex < LANGS.length){
          recognition.lang = LANGS[langIndex];
          micLabel.textContent = 'Ajustando idioma, intente de nuevo...';
        } else {
          micLabel.textContent = 'Idioma no soportado — use el campo de texto';
        }
        break;
      case 'no-speech':
        micLabel.textContent = 'No escuché nada — intente de nuevo';
        break;
      case 'network':
        micLabel.textContent = 'Sin conexión al servicio de voz — revise su internet';
        break;
      case 'aborted':
        micLabel.textContent = 'Toque para hablar';
        break;
      default:
        micLabel.textContent = 'Error: ' + e.error + ' — use el campo de texto';
    }
  };

  recognition.onresult = (e) => { handleInput(e.results[0][0].transcript); };

  micBtn.addEventListener('click', async () => {
    if(recognizing){ recognition.stop(); return; }
    // Pedir permiso de micrófono explícitamente antes de iniciar reconocimiento
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      stream.getTracks().forEach(t => t.stop()); // soltar el mic, solo queríamos el permiso
      recognition.start();
    } catch(err) {
      micLabel.textContent = 'Micrófono bloqueado — permítalo en la configuración del navegador';
      voiceNote.textContent = 'Haga clic en el candado (🔒) de la barra de direcciones > Micrófono > Permitir, luego recargue.';
    }
  });
} else {
  voiceNote.textContent = 'Este navegador no soporta reconocimiento de voz — use el campo de texto.';
  micBtn.disabled = true;
  micBtn.style.opacity = '0.4';
}

sendBtn.addEventListener('click', () => { handleInput(textInput.value); textInput.value = ''; });
textInput.addEventListener('keydown', (e) => { if(e.key === 'Enter'){ handleInput(textInput.value); textInput.value = ''; } });

// ---------- Vista cajero ----------
function renderQueue(){
  const queueList = document.getElementById('queueList');
  const queueCount = document.getElementById('queueCount');
  queueCount.textContent = queue.length + (queue.length === 1 ? ' pedido' : ' pedidos');
  if(queue.length === 0){
    queueList.innerHTML = '<div class="empty-queue">No hay pedidos en cola todavía.</div>';
    return;
  }
  queueList.innerHTML = '';
  queue.forEach(order => {
    const card = document.createElement('div');
    card.className = 'order-card';
    card.innerHTML = `
      <div class="top"><span class="num">#${String(order.num).padStart(3,'0')}</span><span class="time">${order.time}</span></div>
      ${order.items.map(i => `<div class="item"><span>${i.name} x${i.qty}</span><span>$${(i.price*i.qty).toFixed(2)}</span></div>`).join('')}
      <div class="total"><span>Total</span><span>$${order.total.toFixed(2)}</span></div>
      <button class="ready-btn">Marcar listo</button>`;
    card.querySelector('.ready-btn').addEventListener('click', () => {
      queue = queue.filter(o => o.num !== order.num);
      renderQueue();
    });
    queueList.appendChild(card);
  });
}

// ---------- Tabs ----------
document.getElementById('tabCliente').addEventListener('click', () => switchTab('Cliente'));
document.getElementById('tabCajero').addEventListener('click', () => switchTab('Cajero'));
function switchTab(name){
  document.getElementById('tabCliente').classList.toggle('active', name === 'Cliente');
  document.getElementById('tabCajero').classList.toggle('active', name === 'Cajero');
  document.getElementById('viewCliente').classList.toggle('active', name === 'Cliente');
  document.getElementById('viewCajero').classList.toggle('active', name === 'Cajero');
  if(name === 'Cajero') renderQueue();
}
