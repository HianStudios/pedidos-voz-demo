name: Milo - pruebas de regresión
on:
  push:
    branches: [main, 'fix/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: milo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          REDIS_TEST_URL: redis://127.0.0.1:6379
      - run: npm run build
      - name: Instalar navegador de pruebas
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Probar flujo de pedidos en Chrome
        env:
          KIOSK_PIN: '1234'
        run: |
          npm run dev >/tmp/milo-dev.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/menu >/dev/null; then break; fi
            sleep 1
          done
          node tests/order-memory.browser.cjs
          node tests/browser.cjs
